name: CI

on:
  pull_request:
  push:
    branches: [main, v2-next]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run eval:validate
      - run: npm run package:check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high

  node-version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Verify actionable Node 20 failure
        shell: bash
        run: |
          set +e
          node dist/main.js --version >stdout.txt 2>stderr.txt
          status=$?
          test "$status" -eq 1
          test ! -s stdout.txt
          grep -q 'UNSUPPORTED_NODE_VERSION' stderr.txt
          grep -q 'Node.js 22 or newer' stderr.txt
